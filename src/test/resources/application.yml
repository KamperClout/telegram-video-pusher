spring:
  # The bot must not connect to Telegram during tests.
  autoconfigure:
    exclude: org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration

telegram:
  bot:
    token: test-token

video:
  download:
    yt-dlp-path: yt-dlp
    download-dir: ${java.io.tmpdir}/telegram-video-test
    timeout: 5m
    max-file-size: 52428800
    max-height: 1080
    pool-size: 2
    queue-size: 10

rate-limit:
  max-requests-per-minute: 5
